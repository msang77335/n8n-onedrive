version: '3.8'

services:
  browserless:
    image: ghcr.io/browserless/chromium
    # ports:
    #   - "3000:3000"
    networks:
      automation-net:
        aliases:
          - chrome
          - browser
          - headless-chrome
    restart: unless-stopped
    environment:
      - TOKEN=${BROWSERLESS_API_TOKEN}

  n8n:
    image: docker.n8n.io/n8nio/n8n
    # ports:
    #   - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      automation-net:
        aliases:
          - automation
          - workflow
          - n8n-server
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - WEBHOOK_URL=${WEBHOOK_URL}

  express-server:
    build:
      context: ./express-server
      dockerfile: Dockerfile
    # ports:
    #   - "8000:8000"
    networks:
      automation-net:
        aliases:
          - api
          - screenshot-api
          - web-service
    environment:
      - NODE_ENV=production
      - PORT=8000
      - BROWSERLESS_API_TOKEN=${BROWSERLESS_API_TOKEN}
      - BROWSERLESS_PORT=${BROWSERLESS_PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  automation-net:
    driver: bridge

volumes:
  n8n_data:
