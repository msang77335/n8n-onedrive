version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      network1:
      automation-net:
        aliases:
          - automation
          - workflow
          - n8n-server
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - WEBHOOK_URL=${WEBHOOK_URL}

  express-server:
    build:
      context: ./express-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      network1:
      automation-net:
        aliases:
          - api
          - screenshot-api
          - web-service
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CAPTCHA_SOLVER_API_KEY=${CAPTCHA_SOLVER_API_KEY}
      - BROWSERLESS_API_TOKEN=${BROWSERLESS_API_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEBSHARE_TOKEN=${WEBSHARE_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  buzze-resolve-captcha:
    build:
      context: ./buzze-resolve-captcha
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    networks:
      network1:
      automation-net:
        aliases:
          - captcha-solver
          - captcha-api
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

networks:
  automation-net:
    driver: bridge
  network1:
    name: dokploy-network
    external: true

volumes:
  n8n_data:
